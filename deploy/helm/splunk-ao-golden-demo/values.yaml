# Generic defaults only. Environment-specific values (host, image, node) are
# passed with --set by deploy/k8s/scripts/20-deploy.sh from the [k8s] table of
# .streamlit/secrets.toml. Credentials are never Helm values: the templates only
# reference Secrets created by deploy/k8s/scripts/10-prepare-namespace.sh, so
# nothing secret is stored in the Helm release history.

nameOverride: ""

image:
  repository: example/splunk-ao-golden-demo
  # Required. Deploy immutable tags only (<version>-<git short sha>), never "latest".
  tag: ""
  pullPolicy: IfNotPresent

app:
  port: 8501
  # sha256 of the app Secret content, set by 20-deploy.sh; a change rolls the Pod.
  configChecksum: ""
  # Secret holding the app's secrets.toml (key "secrets.toml"); default <release>-app.
  secretName: ""
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# Splunk AO's internal CA (public certificate only), copied into this namespace
# by 10-prepare-namespace.sh. An init container merges it with the system CA
# bundle; SSL_CERT_FILE / REQUESTS_CA_BUNDLE point the SDKs at the merged file.
aoCa:
  enabled: true
  configMapName: ao-internal-ca
  key: ca.crt

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

ingress:
  enabled: true
  className: nginx
  # Required, e.g. golden.<domain>.
  host: ""
  # TLS Secret; default <release>-tls.
  tlsSecretName: ""
  # Basic Auth is enforced by this release's own auth service (authProxy below)
  # through the "auth-url" external-auth annotation. The shared ingress-nginx
  # controller runs with a read-only root file system, so "auth-type: basic"
  # (which writes an htpasswd file inside the controller) cannot be used, and
  # the controller is not changed for this app.
  basicAuth:
    enabled: true
    # htpasswd Secret (key "auth", apr1 hashes); default <release>-basic-auth.
    secretName: ""
    realm: "Splunk AO Golden Demo"
  # Streamlit keeps one WebSocket per browser session; long answers must not time out.
  proxyTimeoutSeconds: 3600
  annotations: {}

# Small nginx that answers ingress-nginx external-auth subrequests: 204 for a
# valid Basic Auth header, 401 + WWW-Authenticate otherwise (the browser shows
# its login prompt). Rendered when ingress.basicAuth.enabled is true.
authProxy:
  image:
    repository: nginxinc/nginx-unprivileged
    tag: 1.30.6-alpine
    digest: sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
    pullPolicy: IfNotPresent
  port: 8080
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 200m
      memory: 64Mi

postgres:
  enabled: true
  image:
    repository: pgvector/pgvector
    tag: pg17
    pullPolicy: IfNotPresent
  database: vectordb
  user: postgres
  # Secret with key "postgres-password"; default <release>-postgres.
  secretName: ""
  storage:
    size: 5Gi
    # Empty uses the cluster default StorageClass.
    storageClassName: ""
  # Pin to one node (node-local storage classes bind the PVC to that node).
  nodeName: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

# Data initialization Job. Never part of the release: 30-init-data.sh renders
# it with --set initJob.enabled=true and creates it on demand (embeddings are billed).
initJob:
  enabled: false
  name: ""
  domains: ["healthcare", "bank", "insurance", "restaurant", "cisco_se"]
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 86400
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
