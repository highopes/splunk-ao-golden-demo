apiVersion: v1
kind: Service
metadata:
  name: {{ include "golden.fullname" . }}-app
  labels:
    {{- include "golden.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  type: ClusterIP
  selector:
    {{- include "golden.selector" . | nindent 4 }}
    app.kubernetes.io/component: app
  ports:
    - name: http
      port: {{ .Values.app.port }}
      targetPort: http
